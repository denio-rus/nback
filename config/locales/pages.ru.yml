ru:
  pages:
    about:
      title: "О MindAtPlay"
      sections:
        project:
          title: "Что это"
          body: "MindAtPlay (mind_at_play) — небольшой сайт для самонаблюдения. Вы проходите короткие тесты и, если хотите, отмечаете самочувствие перед ними. Графики показывают, как меняются ваши собственные результаты."
        not_medical:
          title: "Чем результаты не являются"
          body: "Результаты не медицинские и не научные. Сайт не делает выводов и не ставит оценок. Он показывает только то, что вы сделали."
        same_device:
          title: "Сравнивайте на одном устройстве"
          body: "Время реакции зависит от экрана, мыши, клавиатуры и браузера. Сравнивайте прохождения, сделанные на одном и том же устройстве."
        data:
          title: "Что хранится"
          body: "Тесты не собирают данные о вашем устройстве. При входе в аккаунт сервер хранит технические данные сессии (IP-адрес и браузер). Они удаляются вместе с аккаунтом."
        email:
          title: "Ваша почта"
          body: "Почта хранится только как хэш. Она нужна для подтверждения регистрации и сброса пароля."
        deletion:
          title: "Удаление аккаунта"
          body: "Аккаунт можно удалить в любой момент. Это стирает все ваши данные."
