# PostgreSQL in every environment. Connection settings come from ENV
# (see .env.example; locally they are loaded from .env by dotenv-rails).
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: mind_at_play_dev

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: mind_at_play_test

production:
  primary:
    <<: *default
    database: mind_at_play_production
  cache:
    <<: *default
    database: mind_at_play_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: mind_at_play_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: mind_at_play_production_cable
    migrations_paths: db/cable_migrate
